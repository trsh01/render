<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//ES" "http://www.w3.org/TR/html4/frameset.dtd">
<html>
<head>

        @import url('https://googleapis.com');

        body {

    if (width<900){
        window.location.href = "/mobile";
    }

<frameset rows="5%,95%" border="0" frameborder="0" framespacing="0">

        <frameset rows="75%,25%" border="0" frameborder="0" framespacing="0">
            <frame src="/grafico/BTC-USD" name="contenido" id="graf">
            <frame src="/indices/BTC-USD" name="indice">

        <frame src="/menu" name="menu">
