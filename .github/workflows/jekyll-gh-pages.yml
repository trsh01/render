name: Deploy Python Site
on:
  push:
    branches: ["main"] # Triggers on every push to main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for some deploy actions
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Build Script
        run: python your_script.py # This script should generate static HTML files

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public' # The folder containing your generated HTML files

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
